# Settings of generate_contract.py. Paths are relative to the repo root, where you run it and `datacontract test`.
data: data/csv
output: data-contract/synthea-ms-dataset.odcs.yaml

# Tables to merge, in this order
tables:
  - patients
  - encounters
  - conditions
  - observations
  - medications
  - procedures

# Any ODCS top-level field, set on the contract. v3.2.0 needs the datacontract-cli version pinned in pyproject.toml: older ones reject it.
contract:
  apiVersion: v3.2.0
  id: synthea-ms-dataset
  name: Synthea MS Dataset
  domain: immunology and infection
  status: draft
  description:
    purpose: Synthetic patient, encounter, condition and observation data of a multiple sclerosis (MS) cohort, generated with Synthea.
    usage: Pipeline development and testing of MS data products.
    limitations: Synthetic data. Not for clinical or research conclusions.
  tags:
    - synthea
    - multiple sclerosis
    - MS
  # {model} is the table name. `local` is the CSV files in this repo. Add a server per place the data lands, e.g. `<server-name>` for a bucket.
  servers:
    - server: local
      type: local
      format: csv
      path: data/csv/{model}.csv

# Hand-written fields, applied last. `<table>` sets fields on the schema object, `<table>.<COLUMN>` on the column.
overrides:
  conditions.CODE:
    description: SNOMED CT code of the condition. Multiple sclerosis is 24700007.
