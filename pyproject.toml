[project]
name = "synthea-ms-dataset"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datacontract-cli[csv,duckdb]==1.2.4",
    "dataproduct-cli==0.3.2",
]

[dependency-groups]
notebook = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[tool.uv]
default-groups = ["notebook"]
